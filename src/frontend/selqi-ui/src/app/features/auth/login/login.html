<div class="auth-page">
  <div class="auth-card">

    <div class="auth-card__logo">
      <img src="selqi-logo.svg" alt="Selqi" width="72" height="72">
    </div>

    <h1 class="auth-card__title">Sign in to your account</h1>

    @if (serverError()) {
      <div class="auth-card__error" role="alert">{{ serverError() }}</div>
    }

    <form class="auth-form" (ngSubmit)="submit()" novalidate>

      <div class="form-group" [class.form-group--error]="fieldErrors()['email']">
        <label class="form-label" for="email">Email address</label>
        <input class="form-input" id="email" type="email"
          [(ngModel)]="email" name="email" autocomplete="email"
          placeholder="e.g. name@example.com"
          (ngModelChange)="clearFieldError('email')"
          [class.form-input--error]="fieldErrors()['email']">
        @if (fieldErrors()['email']) {
          <span class="form-error" role="alert">{{ fieldErrors()['email'] }}</span>
        }
      </div>

      <div class="form-group" [class.form-group--error]="fieldErrors()['password']">
        <div class="form-label-row">
          <label class="form-label" for="password">Password</label>
          <a routerLink="/forgot-password" class="form-forgot">Forgotten password?</a>
        </div>
        <input class="form-input" id="password" type="password"
          [(ngModel)]="password" name="password" autocomplete="current-password"
          (ngModelChange)="clearFieldError('password')"
          [class.form-input--error]="fieldErrors()['password']">
        @if (fieldErrors()['password']) {
          <span class="form-error" role="alert">{{ fieldErrors()['password'] }}</span>
        }
      </div>

      <button class="btn-submit" type="submit" [disabled]="loading()">
        @if (loading()) { Signing in... } @else { Sign in }
      </button>

    </form>

    <div class="auth-card__divider">
      <span>New to Selqi?</span>
    </div>

    <a class="btn-secondary" routerLink="/register">Create an account</a>

  </div>
</div>
