name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Selqi.slnx
      - run: dotnet build Selqi.slnx -c Release --no-restore
      - run: dotnet test Selqi.slnx -c Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend/selqi-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/selqi-ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f src/backend/Dockerfile -t selqi-api:ci .
      - run: docker build -f src/frontend/selqi-ui/Dockerfile -t selqi-web:ci .
