name: CI / Deploy

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

env:
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/var/www/selqi' }}
  DEPLOY_COMPOSE_FILE: docker-compose.yml
  # Rebuilt and recreated on every deploy. Databases, caches and other
  # stateful services are never touched.
  APP_SERVICES: ${{ vars.APP_SERVICES || 'api web' }}

jobs:

  # ==========================================
  # CI: the compose file is valid and has the app services
  # Runs on GitHub-hosted runners
  # ==========================================

  check:
    name: Check compose file
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate compose file
        run: |
          set -euo pipefail

          # .env is not in git: give every variable the file uses a
          # placeholder ("1" is valid even where a port is expected) so
          # compose can resolve it.
          { grep -oE '\$\{[A-Za-z_][A-Za-z0-9_]*' "$DEPLOY_COMPOSE_FILE" || true; } \
            | cut -c3- | sort -u | sed 's/$/=1/' > .env

          docker compose -f "$DEPLOY_COMPOSE_FILE" config --quiet

          services=$(docker compose -f "$DEPLOY_COMPOSE_FILE" config --services)
          for s in $APP_SERVICES; do
            grep -qx "$s" <<<"$services" || {
              echo "::error::Service $s is not in $DEPLOY_COMPOSE_FILE"
              exit 1
            }
          done


  # ==========================================
  # DEPLOY: Production server
  # Runs on the self-hosted runner on the production server
  # ==========================================

  deploy:
    name: Deploy to production

    needs:
      - check

    # Never deploy PR validation runs.
    # Deploy only master branch pushes or manual runs
    # started against master.

    if: >
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/master'

    runs-on:
      - self-hosted
      - Linux
      - X64
      - brd
      - local-server

    environment: production

    concurrency:
      group: deploy-selqi
      cancel-in-progress: false

    steps:

      # ------------------------------------------
      # 1. Verify server configuration
      # ------------------------------------------

      - name: Check server prerequisites
        run: |
          set -euo pipefail

          echo "Deployment directory: $DEPLOY_DIR"
          echo "Runner user: $(whoami)"

          git --version
          docker --version
          docker compose version

          if [ ! -d "$DEPLOY_DIR/.git" ]; then
            echo "::error::Deployment directory is not a Git repository"
            exit 1
          fi

          for f in "$DEPLOY_COMPOSE_FILE" .env; do
            if [ ! -f "$DEPLOY_DIR/$f" ]; then
              echo "::error::Missing $DEPLOY_DIR/$f"
              exit 1
            fi
          done

          echo "Server prerequisites verified."


      # ------------------------------------------
      # 2. Update deployment directory
      # ------------------------------------------

      - name: Pull latest master code
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail

          git config --global --add safe.directory "$DEPLOY_DIR"

          echo "Fetching latest master..."

          # Retried: a short network outage between this server and GitHub
          # once failed a deploy here (git exit code 128).
          for attempt in 1 2 3 4 5; do
            if git fetch origin master; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::git fetch failed 5 times"
              exit 1
            fi
            echo "git fetch failed (attempt $attempt of 5); retrying in $((attempt * 10)) s..."
            sleep $((attempt * 10))
          done

          # Force deployment clone onto remote master.
          # This discards local tracked changes. Untracked and
          # ignored files (.env files, uploads) are kept.

          git checkout -f -B master origin/master

          git reset --hard origin/master

          echo "-----------------------------------"
          echo "Deployment branch: $(git branch --show-current)"
          echo "Deployed commit: $(git rev-parse HEAD)"
          echo "Triggered commit: $GITHUB_SHA"
          echo "-----------------------------------"

          git status --short


      # ------------------------------------------
      # 3. Build images
      # ------------------------------------------

      # The running containers keep serving while this builds; if the
      # build fails, nothing is replaced.
      - name: Build images
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail

          docker compose -f "$DEPLOY_COMPOSE_FILE" build $APP_SERVICES


      # ------------------------------------------
      # 4. Recreate app containers
      # ------------------------------------------

      - name: Recreate app containers
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail

          # --no-deps: only the app services, never the database or cache
          # they depend on.
          docker compose -f "$DEPLOY_COMPOSE_FILE" up -d --no-deps $APP_SERVICES

          docker compose -f "$DEPLOY_COMPOSE_FILE" ps


      # ------------------------------------------
      # 5. Verify health
      # ------------------------------------------

      - name: Health check
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail

          # url|mode: "ok" needs a status below 400; "up" accepts anything
          # below 500 (the app answers, it just has no health route there).
          for check in "http://127.0.0.1:5007/health|ok" "http://127.0.0.1:8083/|ok"; do
            url=${check%|*}
            mode=${check#*|}
            echo "Checking $url ($mode)..."

            for i in $(seq 1 30); do
              code=$(curl -s -m 20 -o /dev/null -w "%{http_code}" "$url" || true)
              limit=400
              [ "$mode" = up ] && limit=500
              if [ "$code" -ge 200 ] && [ "$code" -lt "$limit" ]; then
                echo "$url answered $code."
                break
              fi

              if [ "$i" -eq 30 ]; then
                echo "::error::$url did not become healthy (last status $code)"
                docker compose -f "$DEPLOY_COMPOSE_FILE" logs --tail=60 $APP_SERVICES
                exit 1
              fi

              sleep 5
            done
          done


      # ------------------------------------------
      # 6. Remove dangling images
      # ------------------------------------------

      # Only untagged images no container uses (the ones this build replaced).
      - name: Remove dangling images
        run: docker image prune -f


      # ------------------------------------------
      # 7. Deployment summary
      # ------------------------------------------

      - name: Deployment summary
        if: success()
        run: |
          echo "=================================="
          echo "SELQI DEPLOYMENT SUCCESSFUL"
          echo "=================================="
          echo "Commit: $(git -C "$DEPLOY_DIR" rev-parse HEAD)"
          echo "Branch: master"
          echo "Runner: $(hostname)"
          echo "User: $(whoami)"
          echo "=================================="
