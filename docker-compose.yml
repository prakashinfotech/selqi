services:

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      MSSQL_SA_PASSWORD: "${SELQI_DB_PASSWORD:?Set SELQI_DB_PASSWORD in the local .env file}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -C"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__SelqiDb: "Server=db,1433;Database=SelqiDb;User Id=sa;Password=${SELQI_DB_PASSWORD:?Set SELQI_DB_PASSWORD in the local .env file};TrustServerCertificate=True;MultipleActiveResultSets=true"
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: src/frontend/selqi-ui/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  sqldata:
